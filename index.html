<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Berkas Terunggah</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white p-8 rounded-3xl shadow-md w-full max-w-4xl">
        <h2 class="text-2xl font-semibold text-gray-700 mb-6">Daftar Berkas yang Diunggah</h2>
        
        <div class="mb-6">
            <iframe src="daftar.php" class="w-full h-72 border-0 rounded-2xl"></iframe>
        </div>

        <div class="border-t border-gray-100 pt-6 flex flex-col items-center">
            <form action="upload.php" method="POST" enctype="multipart/form-data" class="w-full max-w-md flex flex-col items-center gap-4">
                
                <div id="preview-container" class="hidden w-full flex flex-col items-center p-4 border border-dashed border-green-300 bg-green-50/50 rounded-2xl">
                    <p class="text-xs text-green-500 font-medium mb-2">Pratinjau Berkas Pilihan:</p>
                    <img id="image-preview" src="#" alt="Preview" class="max-h-40 rounded-lg shadow-sm object-contain">
                    <span id="file-info" class="text-xs text-gray-500 mt-2 font-mono"></span>
                </div>

                <label class="w-full flex flex-col items-center px-4 py-4 bg-white text-green-500 rounded-2xl border border-green-200 shadow-sm tracking-wide uppercase cursor-pointer hover:bg-green-500 hover:text-white transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span class="mt-1 text-sm font-semibold text-center normal-case" id="button-text">Pilih Berkas</span>
                    <input type='file' name="fileToUpload" id="fileToUpload" class="hidden" accept="image/*" required />
                </label>

                <button type="submit" name="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-2xl shadow-md hover:shadow-lg transition-all text-sm">
                    Unggah File
                </button>
            </form>
        </div>

    </div>

    <script>
        const fileInput = document.getElementById('fileToUpload');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const fileInfo = document.getElementById('file-info');
        const buttonText = document.getElementById('button-text');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            
            if (file) {
                buttonText.textContent = file.name; // Ganti teks tombol jadi nama file
                fileInfo.textContent = `${file.name} (${(file.size/1024).toFixed(2)} KB)`;

                // Cek jika file yang dipilih adalah gambar
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    
                    reader.addEventListener('load', function() {
                        imagePreview.setAttribute('src', this.result);
                        previewContainer.classList.remove('hidden'); // Munculkan kotak preview
                    });
                    
                    reader.readAsDataURL(file);
                } else {
                    imagePreview.setAttribute('src', '#');
                    previewContainer.classList.remove('hidden');
                }
            } else {
                previewContainer.classList.add('hidden');
                buttonText.textContent = "Pilih Berkas";
            }
        });
    </script>
</body>
</html>
